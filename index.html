<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MHS Store – Jual Beli Akun Sosmed</title>
<meta name="description" content="Beli akun Facebook, YouTube, TikTok, Instagram dan lainnya. Bayar dengan QRIS.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛍️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1b1f3b;--mute:#6b7190;--line:#e6e8f2;--brand:#5b3df5;--brand2:#ede9ff;--ok:#16a34a;--bad:#e11d48;--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #b9a9ff;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--brand)}
.logo span{color:var(--ink)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--bg)}
.nav .sp{flex:1}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--brand2);color:var(--brand)}
.btn.red{background:#ffe4ea;color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px}
.hero{background:linear-gradient(120deg,#5b3df5,#8b6bff);color:#fff;border-radius:20px;margin:22px 0;padding:34px 30px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px);letter-spacing:-.02em;max-width:620px}
.hero p{margin:0;opacity:.92;max-width:560px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#c9bfff;box-shadow:0 6px 20px rgba(91,61,245,.08)}
.badge{align-self:flex-start;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.card h3{margin:0;font-size:16px;line-height:1.35}
.card .meta{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.card .desc{color:var(--mute);font-size:13px;margin:0;flex:1}
.price{font-size:20px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sold{opacity:.55}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:46px}
.how div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.how b{display:block;margin-bottom:4px}
.how span{color:var(--mute);font-size:14px}
footer{background:#fff;border-top:1px solid var(--line);padding:22px 0;color:var(--mute);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,18,50,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.box{background:#fff;border-radius:18px;max-width:420px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.box h2{margin:0 0 4px;font-size:19px}
.box img.qr{width:100%;max-width:300px;display:block;margin:12px auto;border:1px solid var(--line);border-radius:12px}
.muted{color:var(--mute);font-size:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:18px 0}
.panel h2{margin:0 0 12px;font-size:18px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea{min-height:80px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:99}
@media(max-width:640px){.hero{padding:24px 20px}.logo{font-size:17px}}
@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s,border-color .2s}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a href="#" class="logo">MHS<span>Store</span></a>
  <div class="search" id="searchBox"><input id="q" type="search" placeholder="Cari akun, mis. TikTok 10K followers" aria-label="Cari akun"></div>
  <div class="sp"></div>
  <a href="#admin" class="btn ghost sm" id="adminLink">Admin</a>
</div></header>

<main class="wrap" id="app"></main>

<footer><div class="wrap">© <span id="yr"></span> mhsstore.online. Pembayaran via QRIS, konfirmasi lewat WhatsApp.</div></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ====== ISI DUA BARIS INI (dari Supabase → Project Settings → API) ====== */
const SUPABASE_URL = 'https://sxgzpwvnifudlokwtuvo.supabase.co/';
const SUPABASE_KEY = 'sb_publishable_OOljaJZvgXYQCI10RFXkWw_ZvfnuI8x';
/* ======================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PLATFORMS = {Facebook:'#1877f2',YouTube:'#e11d2e',TikTok:'#111827',Instagram:'#d6249f','X / Twitter':'#0f1419',Telegram:'#229ed9',Lainnya:'#7c3aed'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + new Intl.NumberFormat('id-ID').format(n || 0);
const state = {products:[], settings:{}, filter:'Semua', q:'', session:null, editId:null};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#yr').textContent = new Date().getFullYear();

async function load(){
  const [p,s] = await Promise.all([
    sb.from('products').select('*').order('created_at',{ascending:false}),
    sb.from('settings').select('*').eq('id',1).maybeSingle()
  ]);
  state.products = p.data || [];
  state.settings = s.data || {};
  const {data} = await sb.auth.getSession();
  state.session = data.session;
}

/* ---------- Halaman toko ---------- */
function renderShop(){
  $('#searchBox').style.display='';
  const chips = ['Semua',...Object.keys(PLATFORMS)].map(c=>`<button class="chip ${state.filter===c?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('#app').innerHTML = `
    <section class="hero"><h1>Akun sosmed siap pakai, bayar mudah pakai QRIS</h1>
    <p>Pilih akun Facebook, YouTube, TikTok, Instagram dan lainnya. Scan QRIS, kirim bukti bayar, data akun dikirim lewat WhatsApp.</p></section>
    <div class="chips" id="chips">${chips}</div>
    <div class="grid" id="grid"></div>
    <section class="how">
      <div><b>1. Pilih akun</b><span>Cari berdasarkan platform, followers, atau harga.</span></div>
      <div><b>2. Bayar via QRIS</b><span>Scan QRIS dari e-wallet atau mobile banking apa saja.</span></div>
      <div><b>3. Konfirmasi WhatsApp</b><span>Kirim bukti bayar, admin mengirim data akun.</span></div>
    </section>`;
  $('#chips').onclick = e => {const c=e.target.closest('.chip'); if(c){state.filter=c.dataset.c; renderShop(); drawGrid()}};
  drawGrid();
}
function drawGrid(){
  const q = state.q.toLowerCase();
  const list = state.products.filter(p => (state.filter==='Semua'||p.platform===state.filter) &&
    (!q || (p.title+' '+p.platform+' '+(p.description||'')).toLowerCase().includes(q)));
  $('#grid').innerHTML = list.length ? list.map(p=>`
    <article class="card ${p.sold?'sold':''}">
      <span class="badge" style="background:${PLATFORMS[p.platform]||'#7c3aed'}">${esc(p.platform)}</span>
      <h3>${esc(p.title)}</h3>
      <div class="meta">${p.followers?`<span>👥 ${new Intl.NumberFormat('id-ID').format(p.followers)} followers</span>`:''}${p.age?`<span>🗓️ ${esc(p.age)}</span>`:''}</div>
      <p class="desc">${esc(p.description)}</p>
      <div class="row"><span class="price">${rp(p.price)}</span>
      ${p.sold?'<span class="muted"><b>Terjual</b></span>':`<button class="btn sm" data-buy="${p.id}">Beli</button>`}</div>
    </article>`).join('') : '<div class="empty">Belum ada akun yang cocok. Coba kata kunci atau platform lain.</div>';
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>openBuy(b.dataset.buy));
}
$('#q').addEventListener('input',e=>{state.q=e.target.value; if($('#grid'))drawGrid()});

function openBuy(id){
  const p = state.products.find(x=>String(x.id)===String(id)); if(!p) return;
  const wa = (state.settings.wa||'').replace(/\D/g,'');
  const msg = encodeURIComponent(`Halo MHS Store, saya sudah bayar untuk akun: ${p.title} (${rp(p.price)}). Berikut bukti pembayaran.`);
  $('#modalBox').innerHTML = `
    <h2>${esc(p.title)}</h2>
    <div class="price">${rp(p.price)}</div>
    ${state.settings.qris_url ? `<img class="qr" src="${esc(state.settings.qris_url)}" alt="QRIS pembayaran">` : '<p class="muted">QRIS belum tersedia. Hubungi admin lewat WhatsApp.</p>'}
    <p class="muted">Scan QRIS, bayar sesuai nominal, lalu kirim bukti pembayaran ke admin.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost" onclick="closeModal()">Tutup</button>
      ${wa?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${msg}">Kirim bukti bayar</a>`:''}
    </div>`;
  $('#modal').classList.add('open');
}

/* ---------- Halaman admin ---------- */
function renderAdmin(){
  $('#searchBox').style.display='none';
  if(!state.session){
    $('#app').innerHTML = `<div class="panel" style="max-width:380px;margin:50px auto">
      <h2>Masuk admin</h2>
      <form id="lf"><label for="em">Email</label><input id="em" type="email" required autocomplete="username">
      <label for="pw" style="margin-top:10px">Kata sandi</label><input id="pw" type="password" required autocomplete="current-password">
      <button class="btn" style="width:100%;margin-top:14px">Masuk</button></form></div>`;
    $('#lf').onsubmit = async e => {
      e.preventDefault();
      const {data,error} = await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
      if(error) return toast('Email atau kata sandi salah');
      state.session = data.session; renderAdmin();
    };
    return;
  }
  const ed = state.products.find(p=>p.id===state.editId) || {};
  $('#app').innerHTML = `
    <div class="row" style="margin-top:20px"><h1 style="margin:0;font-size:24px">Dashboard admin</h1><button class="btn ghost sm" id="out">Keluar</button></div>

    <div class="panel"><h2>QRIS &amp; WhatsApp</h2>
      <div class="f">
        <div><label for="qf">Upload gambar QRIS (JPG/PNG)</label><input id="qf" type="file" accept="image/*"></div>
        <div><label for="wa">Nomor WhatsApp (format 628xxx)</label><input id="wa" value="${esc(state.settings.wa)}" placeholder="6281234567890"></div>
      </div>
      ${state.settings.qris_url?`<p class="muted">QRIS saat ini:</p><img src="${esc(state.settings.qris_url)}" alt="QRIS saat ini" style="width:140px;border:1px solid var(--line);border-radius:10px">`:''}
      <div style="margin-top:12px"><button class="btn" id="saveSet">Simpan pengaturan</button></div>
    </div>

    <div class="panel"><h2>${ed.id?'Edit produk':'Tambah produk'}</h2>
      <form id="pf"><div class="f">
        <div><label for="t">Judul</label><input id="t" required value="${esc(ed.title)}" placeholder="TikTok 10K followers aktif"></div>
        <div><label for="pl">Platform</label><select id="pl">${Object.keys(PLATFORMS).map(k=>`<option ${ed.platform===k?'selected':''}>${k}</option>`).join('')}</select></div>
        <div><label for="pr">Harga (Rp)</label><input id="pr" type="number" min="0" required value="${ed.price??''}"></div>
        <div><label for="fo">Followers</label><input id="fo" type="number" min="0" value="${ed.followers??''}"></div>
        <div><label for="ag">Usia akun</label><input id="ag" value="${esc(ed.age)}" placeholder="2 tahun"></div>
      </div>
      <label for="ds" style="margin-top:12px">Deskripsi</label><textarea id="ds">${esc(ed.description)}</textarea>
      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn">${ed.id?'Simpan perubahan':'Tambah produk'}</button>${ed.id?'<button type="button" class="btn ghost" id="cancel">Batal</button>':''}</div></form>
    </div>

    <div class="panel"><h2>Daftar produk (${state.products.length})</h2>
      <div class="scroll"><table><thead><tr><th>Judul</th><th>Platform</th><th>Harga</th><th>Status</th><th></th></tr></thead><tbody>
      ${state.products.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.platform)}</td><td>${rp(p.price)}</td>
        <td>${p.sold?'Terjual':'Tersedia'}</td>
        <td style="white-space:nowrap"><button class="btn ghost sm" data-e="${p.id}">Edit</button>
        <button class="btn ghost sm" data-s="${p.id}">${p.sold?'Tandai tersedia':'Tandai terjual'}</button>
        <button class="btn red sm" data-d="${p.id}">Hapus</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">Belum ada produk.</td></tr>'}
      </tbody></table></div></div>`;

  $('#out').onclick = async()=>{await sb.auth.signOut();state.session=null;renderAdmin()};
  $('#saveSet').onclick = async()=>{
    let qris_url = state.settings.qris_url;
    const f = $('#qf').files[0];
    if(f){
      const ext = (f.name.split('.').pop()||'png').toLowerCase();
      const path = `qris-${Date.now()}.${ext}`;
      const up = await sb.storage.from('qris').upload(path,f,{upsert:true,contentType:f.type});
      if(up.error) return toast('Upload gagal: '+up.error.message);
      qris_url = sb.storage.from('qris').getPublicUrl(path).data.publicUrl;
    }
    const {error} = await sb.from('settings').upsert({id:1,qris_url,wa:$('#wa').value.trim()});
    if(error) return toast('Gagal menyimpan: '+error.message);
    toast('Pengaturan disimpan'); await load(); renderAdmin();
  };
  $('#pf').onsubmit = async e=>{
    e.preventDefault();
    const row = {title:$('#t').value.trim(),platform:$('#pl').value,price:+$('#pr').value,followers:+$('#fo').value||0,age:$('#ag').value.trim(),description:$('#ds').value.trim()};
    const r = ed.id ? await sb.from('products').update(row).eq('id',ed.id) : await sb.from('products').insert(row);
    if(r.error) return toast('Gagal: '+r.error.message);
    state.editId=null; toast('Produk disimpan'); await load(); renderAdmin();
  };
  if($('#cancel')) $('#cancel').onclick=()=>{state.editId=null;renderAdmin()};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{state.editId=+b.dataset.e;renderAdmin();scrollTo({top:0})});
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{
    const p=state.products.find(x=>x.id===+b.dataset.s);
    const {error}=await sb.from('products').update({sold:!p.sold}).eq('id',p.id);
    if(error) return toast(error.message); await load(); renderAdmin();
  });
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Hapus produk ini?')) return;
    const {error}=await sb.from('products').delete().eq('id',+b.dataset.d);
    if(error) return toast(error.message); await load(); renderAdmin();
  });
}

function route(){ location.hash==='#admin' ? renderAdmin() : renderShop(); }
window.addEventListener('hashchange',route);
load().then(route).catch(()=>{$('#app').innerHTML='<div class="empty">Gagal memuat data. Periksa konfigurasi Supabase di index.html.</div>'});
</script>
</body>
</html>
